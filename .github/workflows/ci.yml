name: checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  query-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and recording dependencies
        run: python -m pip install ".[test,record]" "build==1.3.0"
      - name: Query contract and CLI tests
        run: python -m pytest -q
      - name: Competent baseline preflight
        run: python research/preflight.py
      - name: Build distributions
        run: python scripts/build_release.py
      - name: Install wheel outside the checkout
        run: python scripts/wheel_smoke.py dist/agent_aftertrace-0.1.0a1-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
